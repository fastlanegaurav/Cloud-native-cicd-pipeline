version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cicd-demo
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=development
      - APP_VERSION=local
      - PORT=5000
    volumes:
      - ./app:/app          # Hot-reload in dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy (uncomment for production-like setup)
  # nginx:
  #   image: nginx:alpine
  #   container_name: nginx-proxy
  #   ports:
  #     - "80:80"
