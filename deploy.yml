name: 🚀 Deploy

on:
  push:
    branches: [ main ]       # Auto-deploy on push to main
  workflow_dispatch:          # Also allow manual trigger
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options: [ production, staging ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Job 1: Run tests before deploying ────────────────────────
  pre-deploy-tests:
    name: ✅ Pre-Deploy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt pytest pytest-flask
      - run: pytest tests/ -v --tb=short

  # ── Job 2: Deploy to AWS EC2 ─────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: pre-deploy-tests          # Only deploy if tests pass
    environment: production          # Uses GitHub Environment secrets

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ── Configure AWS credentials ────────────────────────────
      - name: ☁️ Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── SSH into EC2 and deploy ──────────────────────────────
      - name: 🔑 Add SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: 🚀 Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}          # e.g. ubuntu or ec2-user
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          APP_VERSION: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << EOF
            echo "🔑 Logging in to Docker Hub..."
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            echo "⬇️ Pulling latest image..."
            docker pull $DOCKERHUB_USERNAME/cicd-demo:latest

            echo "🛑 Stopping old container (if running)..."
            docker stop cicd-demo || true
            docker rm   cicd-demo || true

            echo "▶️ Starting new container..."
            docker run -d \
              --name cicd-demo \
              --restart unless-stopped \
              -p 80:5000 \
              -e APP_ENV=production \
              -e APP_VERSION=$APP_VERSION \
              $DOCKERHUB_USERNAME/cicd-demo:latest

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Health check..."
            sleep 5
            curl -f http://localhost/health && echo "🎉 Deploy successful!"
          EOF

      # ── Post-deploy notification ─────────────────────────────
      - name: 📣 Notify on Success
        if: success()
        run: |
          echo "✅ Deployment to production succeeded!"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          # Optional: Add Slack/Discord webhook notification here

      - name: ❌ Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment FAILED for commit ${{ github.sha }}"
          # Optional: Add Slack/Discord webhook notification here
